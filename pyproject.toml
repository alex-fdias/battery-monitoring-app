[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_monitoring_app_amfd"]

[project]
name = "battery-monitoring-app-amfd"
version = "0.9.2"
authors = [
  { name="AMFD", email="amfd@email.com" },
]
description = "Battery Monitoring Application using PyQt/PyQtGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.1",
	"PyQt6==6.11.0",
	"pyqtgraph==0.14.0",
	"pyserial==3.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"